<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0e1a" media="(prefers-color-scheme: dark)">
    <title>后台登录 | KC GPT自动充值系统</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
        <!-- Lucide v1.56.0 (ISC) -->
        <symbol id="i-zap" viewBox="0 0 24 24"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></symbol>
        <symbol id="i-lock-keyhole" viewBox="0 0 24 24"><circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></symbol>
    </svg>

    <div class="login-shell">
        <div class="login-brand">
            <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-zap"></use></svg></span>
            <span>KC GPT自动充值系统</span>
        </div>
        <main class="card">
            <div id="stepLogin" class="step active">
                <h1>后台登录</h1>
                <p>使用管理员邮箱和密码登录。若已启用二次验证，登录后还需验证。</p>
                <label for="email">管理员邮箱</label>
                <input id="email" type="email" placeholder="请输入管理员邮箱" autocomplete="username">
                <label for="password">登录密码</label>
                <input id="password" type="password" placeholder="请输入登录密码" autocomplete="current-password">
                <button id="loginBtn" type="button">继续</button>
            </div>

            <div id="step2fa" class="step">
                <h1>二次验证</h1>
                <p id="step2faHint">请选择验证方式并输入验证码。</p>
                <div id="methodTabs" class="method-tabs" style="display:none;"></div>
                <div id="methodSingle" class="method-single" style="display:none;"></div>
                <div id="methodHint" class="method-hint"></div>
                <label for="code">验证码</label>
                <input id="code" type="text" inputmode="numeric" maxlength="8" placeholder="6 位验证码" autocomplete="one-time-code">
                <button id="sendTgBtn" type="button" class="secondary" style="display:none;">发送 Telegram 验证码</button>
                <button id="verifyBtn" type="button">验证并登录</button>
                <button id="backBtn" type="button" class="secondary">返回</button>
            </div>

            <div id="message" class="message"></div>
            <div class="hint"><svg class="icon" aria-hidden="true"><use href="#i-lock-keyhole"></use></svg><span>登录失败 5 次将锁定 30 分钟。可在后台「系统配置 → 安全设置」切换验证方式。</span></div>
        </main>
    </div>

    <script>
        const TOKEN_KEY = 'plus_admin_token';
        const SECONDARY_TOKEN_KEY = 'plus_admin_secondary_token';
        const METHOD_LABELS = {
            totp: 'Google Authenticator',
            telegram: 'Telegram 验证码'
        };
        const METHOD_HINTS = {
            totp: '请打开 Google Authenticator，输入当前 6 位动态码。',
            telegram: '点击下方按钮发送验证码到管理员 Telegram，再输入 6 位数字。'
        };
        const state = { challengeToken: '', methods: [], selectedMethod: '' };
        let adminPanelPath = '/admin';

        async function loadAdminPaths() {
            try {
                const response = await fetch('/api/public/admin-paths');
                const data = await response.json();
                if (data.success) {
                    adminPanelPath = data.panelUrl || `/${data.panelPath || 'admin'}`;
                }
            } catch (_) { }
        }

        function goToAdminPanel() {
            location.href = adminPanelPath;
        }

        function getBrowserFingerprint() {
            const parts = [
                navigator.userAgent,
                navigator.language,
                screen.width,
                screen.height,
                Intl.DateTimeFormat().resolvedOptions().timeZone || ''
            ];
            return btoa(unescape(encodeURIComponent(parts.join('|')))).slice(0, 96);
        }

        function setMessage(text, isSuccess) {
            const el = document.getElementById('message');
            el.textContent = text || '';
            el.className = 'message' + (isSuccess ? ' success' : '');
        }

        function showStep(name) {
            document.querySelectorAll('.step').forEach((el) => el.classList.remove('active'));
            document.getElementById(name === '2fa' ? 'step2fa' : 'stepLogin').classList.add('active');
        }

        function updateMethodUi() {
            const method = state.selectedMethod;
            const hintEl = document.getElementById('methodHint');
            const sendTgBtn = document.getElementById('sendTgBtn');
            const codeInput = document.getElementById('code');

            hintEl.textContent = METHOD_HINTS[method] || '请输入验证码';
            sendTgBtn.style.display = method === 'telegram' ? 'block' : 'none';
            codeInput.placeholder = method === 'totp' ? 'Google Authenticator 6 位码' : 'Telegram 6 位验证码';
            codeInput.value = '';
            setMessage('');
        }

        function selectMethod(method) {
            if (!state.methods.includes(method)) return;
            state.selectedMethod = method;
            document.querySelectorAll('.method-tab').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.method === method);
            });
            updateMethodUi();
        }

        function renderMethods(methods, defaultMethod) {
            const tabs = document.getElementById('methodTabs');
            const single = document.getElementById('methodSingle');
            tabs.innerHTML = '';
            state.methods = methods || [];
            state.selectedMethod = defaultMethod && methods.includes(defaultMethod)
                ? defaultMethod
                : (methods[0] || '');

            if (methods.length <= 1) {
                tabs.style.display = 'none';
                single.style.display = methods.length ? 'block' : 'none';
                single.textContent = methods.length
                    ? `验证方式：${METHOD_LABELS[methods[0]] || methods[0]}`
                    : '';
            } else {
                tabs.style.display = 'flex';
                single.style.display = 'none';
                methods.forEach((method) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'method-tab' + (method === state.selectedMethod ? ' active' : '');
                    btn.dataset.method = method;
                    btn.textContent = METHOD_LABELS[method] || method;
                    btn.onclick = () => selectMethod(method);
                    tabs.appendChild(btn);
                });
            }
            updateMethodUi();
        }

        async function verifyExistingToken() {
            const token = localStorage.getItem(TOKEN_KEY);
            if (!token) return;
            try {
                const response = await fetch('/api/admin/session', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (!response.ok) {
                    localStorage.removeItem(TOKEN_KEY);
                    localStorage.removeItem(SECONDARY_TOKEN_KEY);
                    return;
                }
                const data = await response.json();
                if (data.refreshed && data.token) {
                    localStorage.setItem(TOKEN_KEY, data.token);
                }
                location.href = adminPanelPath;
            } catch (_) {
                localStorage.removeItem(TOKEN_KEY);
                localStorage.removeItem(SECONDARY_TOKEN_KEY);
            }
        }

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) {
                setMessage('请输入邮箱和密码');
                return;
            }
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            setMessage('');
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, fingerprint: getBrowserFingerprint() })
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    setMessage(data.message || '登录失败');
                    return;
                }
                if (data.requires2fa) {
                    state.challengeToken = data.challengeToken;
                    renderMethods(data.methods || [], data.defaultMethod || '');
                    const modeHint = data.login2faMode === 'either' && (data.methods || []).length > 1
                        ? '可在下方切换 Google Authenticator / Telegram 验证。'
                        : '';
                    document.getElementById('step2faHint').textContent =
                        `账号 ${data.email || email} 需要二次验证。${modeHint}`;
                    showStep('2fa');
                    return;
                }
                if (data.token) {
                    localStorage.setItem(TOKEN_KEY, data.token);
                    localStorage.removeItem(SECONDARY_TOKEN_KEY);
                    adminPanelPath = data.panelPath || adminPanelPath;
                    goToAdminPanel();
                }
            } catch (_) {
                setMessage('登录请求失败');
            } finally {
                loginBtn.disabled = false;
            }
        }

        async function sendTelegramCode() {
            if (state.selectedMethod !== 'telegram') {
                setMessage('请先切换到 Telegram 验证码');
                return;
            }
            const btn = document.getElementById('sendTgBtn');
            btn.disabled = true;
            try {
                const response = await fetch('/api/admin/login/send-tg-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ challengeToken: state.challengeToken })
                });
                const data = await response.json();
                setMessage(data.message || (data.success ? '验证码已发送' : '发送失败'), data.success);
            } catch (_) {
                setMessage('发送失败');
            } finally {
                btn.disabled = false;
            }
        }

        async function verify2fa() {
            const code = document.getElementById('code').value.trim();
            if (!code) {
                setMessage('请输入验证码');
                return;
            }
            if (!state.selectedMethod) {
                setMessage('请选择验证方式');
                return;
            }
            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.disabled = true;
            setMessage('');
            try {
                const response = await fetch('/api/admin/login/verify-2fa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        challengeToken: state.challengeToken,
                        method: state.selectedMethod,
                        code,
                        fingerprint: getBrowserFingerprint()
                    })
                });
                const data = await response.json();
                if (!response.ok || !data.success || !data.token) {
                    setMessage(data.message || '验证失败');
                    return;
                }
                localStorage.setItem(TOKEN_KEY, data.token);
                localStorage.removeItem(SECONDARY_TOKEN_KEY);
                adminPanelPath = data.panelPath || adminPanelPath;
                goToAdminPanel();
            } catch (_) {
                setMessage('验证请求失败');
            } finally {
                verifyBtn.disabled = false;
            }
        }

        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('verifyBtn').addEventListener('click', verify2fa);
        document.getElementById('sendTgBtn').addEventListener('click', sendTelegramCode);
        document.getElementById('backBtn').addEventListener('click', () => showStep('login'));
        document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
        document.getElementById('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') verify2fa(); });

        loadAdminPaths().then(() => verifyExistingToken());
    </script>
</body>
</html>
