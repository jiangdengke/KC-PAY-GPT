# 边缘限流区定义（放到 /etc/nginx/conf.d/，属于 http 级别）
# $binary_remote_addr 会在 server 块经 cloudflare-realip.conf 还原为真实客户端 IP
limit_req_zone $binary_remote_addr zone=kc_admin_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kc_admin_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=kc_public_api:10m rate=15r/s;
