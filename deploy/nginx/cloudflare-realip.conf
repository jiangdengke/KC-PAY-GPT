# 只在请求确实来自 Cloudflare 时，用 CF-Connecting-IP 还原真实客户端 IP（$remote_addr）。
# 直连源站的请求不在这些网段内，$remote_addr 保持为真实对端地址，无法伪造。
# 网段来源：https://www.cloudflare.com/ips-v4 与 https://www.cloudflare.com/ips-v6（2026-10-24）
# 放到 /etc/nginx/snippets/cloudflare-realip.conf，在 server 块中 include。
