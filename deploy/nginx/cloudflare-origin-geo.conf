# 标记原始 TCP 连接是否来自 Cloudflare。必须用 $realip_remote_addr：real_ip 已把 $remote_addr 改成真实客户端 IP。
# 放到 /etc/nginx/conf.d/（http 级别），在 server 块里用 if ($from_cloudflare = 0) { return 444; }
# 网段与 cloudflare-realip.conf 保持一致，来源 https://www.cloudflare.com/ips-v4 与 ips-v6（2026-10-24）
geo $realip_remote_addr $from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
