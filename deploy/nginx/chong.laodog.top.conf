server {
    listen 80;
    listen [::]:80;
    server_name chong.laodog.top;

    # 仅接受经 Cloudflare 转发的连接，防止直连源站 IP 绕过边缘防护
    include /etc/nginx/snippets/cloudflare-realip.conf;
    if ($from_cloudflare = 0) {
        return 444;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chong.laodog.top;

    ssl_certificate /etc/letsencrypt/live/chong.laodog.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chong.laodog.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 15m;

    # 还原真实客户端 IP；app 的登录限流只信任下面写入的 X-Real-IP
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # 只接受经 Cloudflare 转发的连接，直连源站 IP 的请求直接断开（$from_cloudflare 见 cloudflare-origin-geo.conf）
    if ($from_cloudflare = 0) {
        return 444;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;

    # 后台登录与二次验证接口严格限流（10 次/分，允许 10 次突发，不阻碍正常登录+验证码流程）
    location ^~ /api/admin/login {
        limit_req zone=kc_admin_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 后台其余 API 限流（拦截高频伪造令牌/扫描，正常面板刷新不受影响）
    location ^~ /api/admin/ {
        limit_req zone=kc_admin_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 公开接口边缘限流（配合应用层配额）
    location ^~ /api/ {
        limit_req zone=kc_public_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而不是追加：客户端自带的 X-Forwarded-For 不能传给 app
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
