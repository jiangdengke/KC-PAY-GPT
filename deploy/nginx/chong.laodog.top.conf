server {
    listen 80;
    listen [::]:80;
    server_name chong.laodog.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chong.laodog.top;

    ssl_certificate /etc/letsencrypt/live/chong.laodog.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chong.laodog.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 15m;

    # 还原真实客户端 IP；app 的登录限流只信任下面写入的 X-Real-IP
    include /etc/nginx/snippets/cloudflare-realip.conf;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而不是追加：客户端自带的 X-Forwarded-For 不能传给 app
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
