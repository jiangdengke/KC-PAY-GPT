# ============================================================
# Docker Compose — 一键部署 ChatGPT Plus 自动化开通工具
# 包含 MySQL 8 + 应用服务
# ============================================================
name: kc-gpt-pay2

services:
  mysql:
    image: mysql:8.0
    container_name: kc-gpt-pay2-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-your_mysql_password}
      MYSQL_DATABASE: ${DB_NAME:-plus_papay}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    # 只监听本机；需要远程连库请用 SSH 隧道：ssh -L 3310:127.0.0.1:3310 <server>
    ports:
      - "127.0.0.1:3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      args:
        BUILD_HCAPTCHA_SOLVER: ${BUILD_HCAPTCHA_SOLVER:-0}
    container_name: kc-gpt-pay2-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-3100}:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-your_mysql_password}
      DB_NAME: ${DB_NAME:-plus_papay}
      DB_POOL_LIMIT: 60
      HEADFUL: 0
      PROXY: ${PROXY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vru.cc}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-}
      HCAPTCHA_CONFIG_FILE: /app/data/hcaptcha-config.json
      HCAPTCHA_VLM_API_KEY: ${HCAPTCHA_VLM_API_KEY:-}
      HCAPTCHA_VLM_BASE_URL: ${HCAPTCHA_VLM_BASE_URL:-https://api.openai.com/v1}
      HCAPTCHA_VLM_MODEL: ${HCAPTCHA_VLM_MODEL:-gpt-5.5}
      HCAPTCHA_CAPTCHA_PLATFORM_API_KEY: ${HCAPTCHA_CAPTCHA_PLATFORM_API_KEY:-}
      HCAPTCHA_CAPTCHA_PLATFORM_API_URL: ${HCAPTCHA_CAPTCHA_PLATFORM_API_URL:-https://api.capsolver.com}
      HCAPTCHA_CAPTCHA_PLATFORM_TIMEOUT: ${HCAPTCHA_CAPTCHA_PLATFORM_TIMEOUT:-180}
      HCAPTCHA_SOLVER_ENABLED: ${HCAPTCHA_SOLVER_ENABLED:-0}
      ORBITCARD_API_SECRET: ${ORBITCARD_API_SECRET:-}
      CHATGPT_SESSION_COOKIE: ${CHATGPT_SESSION_COOKIE:-}
      BROWSER_POOL: ${BROWSER_POOL:-1}
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-2}
      BROWSER_POOL_MAX_SIZE: ${BROWSER_POOL_MAX_SIZE:-24}
      BROWSER_POOL_BASE_PORT: ${BROWSER_POOL_BASE_PORT:-19222}
    # 代码与静态页只读挂载：即使应用被入侵，也无法改写宿主机上的源码留后门
    volumes:
      - ./debug_screenshots:/app/debug_screenshots
      - ./data:/app/data
      - ./product_files:/app/product_files
      - ./public:/app/public:ro
      - ./server.js:/app/server.js:ro
      - ./chatgpt.js:/app/chatgpt.js:ro
      - ./index.js:/app/index.js:ro
      - ./playwright-proxy.js:/app/playwright-proxy.js:ro
      - ./mysql-store.js:/app/mysql-store.js:ro
      - ./hcaptcha-runtime.js:/app/hcaptcha-runtime.js:ro
      - ./payment-retry.js:/app/payment-retry.js:ro
      - ./proxy-pool.js:/app/proxy-pool.js:ro
      - ./stripe-payment.js:/app/stripe-payment.js:ro
      - ./hcaptcha-solver.js:/app/hcaptcha-solver.js:ro
      - ./captcha-platform.js:/app/captcha-platform.js:ro
      - ./hcaptcha-runtime.js:/app/hcaptcha-runtime.js:ro
      - ./human-verification.js:/app/human-verification.js:ro
      - ./auth-page-detect.js:/app/auth-page-detect.js:ro
      - ./session-auth.js:/app/session-auth.js:ro
      - ./subscription-check.js:/app/subscription-check.js:ro
      - ./pricing-checkout.js:/app/pricing-checkout.js:ro
      - ./tax-free-address.js:/app/tax-free-address.js:ro
      - ./browser-pool.js:/app/browser-pool.js:ro
      - ./browser-pool-client.js:/app/browser-pool-client.js:ro
      - ./browser-standalone.js:/app/browser-standalone.js:ro
      - ./browser-runtime.js:/app/browser-runtime.js:ro
      - ./admin-auth.js:/app/admin-auth.js:ro
      - ./admin-paths.js:/app/admin-paths.js:ro
      - ./telegram-notify.js:/app/telegram-notify.js:ro
      - ./gpt-api-client.js:/app/gpt-api-client.js:ro
      - ./gpt-api-failure.js:/app/gpt-api-failure.js:ro
      - ./orbitcard-client.js:/app/orbitcard-client.js:ro
      - ./plan-registry.js:/app/plan-registry.js:ro
      - ./hcaptcha/solver.py:/app/hcaptcha/solver.py:ro
    # 浏览器自动化 + hCaptcha ML 推理需要较大共享内存
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          memory: 6G

volumes:
  mysql_data:
