# ============================================================
# Docker Compose — KC GPT Pay
# 包含 MySQL 8 + 轻量 Node.js 应用服务（无浏览器/ML 依赖）
# ============================================================
name: kc-gpt-pay2

services:
  mysql:
    image: mysql:8.0
    container_name: kc-gpt-pay2-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-your_mysql_password}
      MYSQL_DATABASE: ${DB_NAME:-plus_papay}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    # 只监听本机；需要远程连库请用 SSH 隧道：ssh -L 3310:127.0.0.1:3310 <server>
    ports:
      - "127.0.0.1:3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
    container_name: kc-gpt-pay2-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-3100}:3000"
    environment:
      PORT: 3000
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-15mb}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-your_mysql_password}
      DB_NAME: ${DB_NAME:-plus_papay}
      DB_POOL_LIMIT: ${DB_POOL_LIMIT:-60}
      PROXY: ${PROXY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vru.cc}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_SECONDARY_PASSWORD: ${ADMIN_SECONDARY_PASSWORD:-}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      ORBITCARD_API_SECRET: ${ORBITCARD_API_SECRET:-}
      GPT_API_MAX_POLLS: ${GPT_API_MAX_POLLS:-}
    # 代码与静态页只读挂载：即使应用层受损，也无法改写宿主机源码
    volumes:
      - ./data:/app/data
      - ./public:/app/public:ro
      - ./server.js:/app/server.js:ro
      - ./src:/app/src:ro
      - ./mysql-schema.sql:/app/mysql-schema.sql:ro
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  mysql_data:
